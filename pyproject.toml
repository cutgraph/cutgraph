[project]
name = "cutgraph"
version = "0.2.0"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE", "NOTICE", "schema/LICENSE"]
requires-python = ">=3.12"
readme = "README.md"

[tool.cutgraph]
minimum-supported-version = "0.2.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Ruff's documented default rule set: E4, E7, E9, and F.
select = ["E4", "E7", "E9", "F"]
