version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@types/node"
        versions: ["26.x"]
      - dependency-name: "typescript"
        versions: ["7.x"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /motion-core
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
