name: Motion-core Linux goldens

# Records candidate Linux pixel goldens for review; a maintainer commits them by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  record:
    name: record Linux goldens
    # Private repositories opt in to hosted runner usage with a repository variable.
    if: ${{ !github.event.repository.private || vars.HOSTED_CI == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: motion-core/package-lock.json

      # The renderer CLI tests pipe frames to ffmpeg, as in the main checks job.
      - name: Install verified Linux ffmpeg
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-8.1.3-linux64-gpl.tar.xz'
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1.tar.xz' -OutFile $archive
          $expected = '97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'ffmpeg archive checksum mismatch'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          tar -xJf $archive -C $destination
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bins = @(Get-ChildItem -LiteralPath $destination -Directory -Recurse -Filter bin)
          if ($bins.Count -ne 1) { throw 'Expected one ffmpeg bin directory' }
          $bins[0].FullName >> $env:GITHUB_PATH

      - name: Install motion-core dependencies
        working-directory: motion-core
        run: npm ci

      - name: Record goldens
        working-directory: motion-core
        run: |
          node scripts/update-goldens.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = @(Get-ChildItem test/*.golden.win32.json | ForEach-Object { $_.Name -replace '\.win32\.json$', '' } | Sort-Object)
          $recorded = @(Get-ChildItem test/*.golden.linux.json | Sort-Object Name)
          $names = @($recorded | ForEach-Object { $_.Name -replace '\.linux\.json$', '' })
          if (-not $expected -or (Compare-Object $expected $names)) {
            throw 'Linux recordings must cover exactly the Windows recordings'
          }
          $out = Join-Path $env:RUNNER_TEMP 'goldens'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $recorded | Copy-Item -Destination $out
          '## Linux goldens' >> $env:GITHUB_STEP_SUMMARY
          '```text' >> $env:GITHUB_STEP_SUMMARY
          $recorded | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path -Leaf $_.Path) } >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      # Every pixel check must pass against the new recordings before anyone reviews them.
      - name: Verify recordings
        working-directory: motion-core
        run: node --test (Get-ChildItem test/*.test.ts).FullName

      - name: Render contact sheet
        working-directory: motion-core
        run: node scripts/contact-sheet.ts "$env:RUNNER_TEMP/goldens/contact-sheet"

      - name: Upload goldens
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: motion-core-linux-goldens
          path: ${{ runner.temp }}/goldens/
          if-no-files-found: error
          retention-days: 14
